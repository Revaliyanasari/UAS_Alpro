# Konfigurasi Netlify (gratis): aplikasi + proxy AI DeepSeek dalam SATU alamat.
# Langkah aktivasi: docs/DEPLOYMENT.md. API key TIDAK ditulis di sini — isi AI_API_KEY di dasbor Netlify.

[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Header keamanan dasar
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
